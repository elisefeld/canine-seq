project:
  name: ORBIT # Name of project used to define input and output directories

run:
  run_name:  run_ORBIT_updatedref_new
  sample_sheet: "sample_sheet.csv"
  ref_species: "Canis_lupus_familiarisgsd"
  ref_build: "UU_Cfam_GSD_1.0"
  ref_release: "Custom"
  run_by: Elise Hachfeld

ref: 
  fasta: "genome.fa"
  cdna: "cdna.fa"
  gtf: "genes.gtf.gz"

path: # Do NOT change these unless you are confident in directory structure and file locations.
  run_dir: "runs"
  data_dir: "data"
  reference_dir: "reference"
  results_dir: "results"
  report_dir: "report"
  log_dir: "logs"
  
threads:
  samtools: 6
  fastqc: 1
  fastp: 4
  kallisto: 4
  hisat2: 8
  featurecounts: 2